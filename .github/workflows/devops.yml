name: Terraform CI/CD

on:

  # Run on every branch push
  push:
    branches:
      - "**"

  # Run on Pull Request targeting main
  pull_request:
    branches:
      - main


# =========================================================
# PERMISSIONS
# =========================================================

permissions:
  contents: read
  id-token: write
  security-events: write


jobs:

  # =========================================================
  # TERRAFORM PLAN + SECURITY + COST
  # =========================================================

  terraform-plan:

    name: Terraform Plan + Security Scan

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      # -----------------------------------------------------
      # Checkout Repository
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # -----------------------------------------------------
      # Azure Login
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # =====================================================
      # TERRAFORM FORMAT
      # =====================================================

      - name: Terraform Format Check
        working-directory: ./environments/dev
        run: terraform fmt -check -recursive


      # =====================================================
      # TFLINT
      # =====================================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
          cache: true


      - name: Initialize TFLint
        working-directory: ./environments/dev
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}


      - name: Run TFLint
        working-directory: ./environments/dev
        run: |
          mkdir -p ../../reports

          tflint \
            --format compact \
            > ../../reports/tflint-report.txt


      # =====================================================
      # TFSEC
      # =====================================================

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash


      - name: Run tfsec
        working-directory: ./environments/dev
        continue-on-error: true
        run: |
          mkdir -p ../../reports

          tfsec . \
            --format json \
            --out ../../reports/tfsec-report.json

          tfsec . \
            --format lovely \
            > ../../reports/tfsec-report.txt


      # =====================================================
      # TERRAFORM INIT
      # =====================================================

      - name: Terraform Init
        working-directory: ./environments/dev
        run: terraform init


      # =====================================================
      # TERRAFORM VALIDATE
      # =====================================================

      - name: Terraform Validate
        working-directory: ./environments/dev
        run: terraform validate


      # =====================================================
      # TERRAFORM PLAN
      # =====================================================

      - name: Terraform Plan
        working-directory: ./environments/dev
        run: terraform plan -out=tfplan


      # =====================================================
      # CREATE JSON PLAN
      # =====================================================

      - name: Terraform Plan JSON
        working-directory: ./environments/dev
        run: |
          terraform show \
            -json tfplan \
            > ../../reports/terraform-plan.json


      # =====================================================
      # INFRACOST
      # =====================================================

      - name: Install Infracost
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh


      - name: Run Infracost
        working-directory: ./environments/dev
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost scan \
            --path . \
            --format json \
            --out-file ../../reports/infracost-report.json


      - name: Infracost Table
        working-directory: ./environments/dev
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost scan \
            --path . \
            --format table


      # =====================================================
      # UPLOAD REPORTS
      # =====================================================

      - name: Upload Security and Terraform Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-security-cost-reports
          path: reports/


  # =========================================================
  # TERRAFORM APPLY
  # =========================================================

  terraform-apply:

    name: Terraform Apply

    needs: terraform-plan

    # Apply ONLY on push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # -----------------------------------------------------
      # Checkout Repository
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # -----------------------------------------------------
      # Azure Login
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # -----------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------

      - name: Terraform Init
        working-directory: ./environments/dev
        run: terraform init


      # -----------------------------------------------------
      # Terraform Apply
      # -----------------------------------------------------

      - name: Terraform Apply
        working-directory: ./environments/dev
        run: terraform apply -auto-approve